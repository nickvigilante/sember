name: sember
description: Check that Markdown follows semantic line breaks.
author: Nick Vigilante
branding:
  icon: align-left
  color: orange

inputs:
  changed:
    description: >-
      Check only the paragraphs changed since this git ref. Defaults to the
      base branch on pull requests, so a repository can adopt sember one PR
      at a time. Set it to "false" to check whole files.
    required: false
    default: ""
  paths:
    description: >-
      Files or directories to check, separated by spaces. Defaults to every
      changed file with `changed`, otherwise ".".
    required: false
    default: ""
  args:
    description: Extra arguments for sember, such as `--style sembr`.
    required: false
    default: ""
  working-directory:
    description: Where to run sember. Config files are found from each file up.
    required: false
    default: "."

outputs:
  files:
    description: The files that need formatting, one per line, relative to the repository.
    value: ${{ steps.check.outputs.files }}

runs:
  using: composite
  steps:
    # Prefer the prebuilt release that matches the version this action was
    # pinned to. Anything unexpected falls through to building from source:
    # a platform without a prebuilt, a version that isn't released yet, a
    # runner without gh, or a checksum mismatch.
    - name: Install sember
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_REPO: ${{ github.action_repository || github.repository }}
      run: |
        set +e -u
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          *) echo "No prebuilt sember for $RUNNER_OS-$RUNNER_ARCH; building from source."; exit 0 ;;
        esac
        version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$GITHUB_ACTION_PATH/Cargo.toml" | head -n 1)
        archive="sember-$target.tar.xz"
        dir="$RUNNER_TEMP/sember-download"
        rm -rf "$dir"
        mkdir -p "$dir" "$RUNNER_TEMP/sember/bin"
        if ! gh release download "v$version" --repo "$ACTION_REPO" --dir "$dir" \
          --pattern "$archive" --pattern "$archive.sha256"; then
          echo "No prebuilt sember v$version; building from source."
          exit 0
        fi
        expected=$(awk 'NR == 1 { print $1 }' "$dir/$archive.sha256")
        if command -v sha256sum > /dev/null; then
          actual=$(sha256sum "$dir/$archive" | awk '{ print $1 }')
        else
          actual=$(shasum -a 256 "$dir/$archive" | awk '{ print $1 }')
        fi
        if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
          echo "::warning::Checksum mismatch for $archive; building from source."
          exit 0
        fi
        if tar -xJf "$dir/$archive" -C "$dir" && \
          install -m 755 "$dir/sember-$target/sember" "$RUNNER_TEMP/sember/bin/sember"; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/sember/bin/sember" --version
        else
          echo "Could not unpack $archive; building from source."
        fi

    # Otherwise build the sember this action was pinned to, cached by its source.
    - name: Fingerprint sember's source
      id: source
      if: steps.install.outputs.installed != 'true'
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        key=$(find Cargo.toml Cargo.lock src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
        echo "key=sember-${{ runner.os }}-${{ runner.arch }}-$key" >> "$GITHUB_OUTPUT"
    - name: Restore sember
      id: cache
      if: steps.install.outputs.installed != 'true'
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/sember/bin
        key: ${{ steps.source.outputs.key }}
    - name: Build sember
      if: steps.install.outputs.installed != 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --locked --quiet --path "$GITHUB_ACTION_PATH" --root "$RUNNER_TEMP/sember"

    - name: Run sember --check
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHANGED: ${{ inputs.changed }}
        BASE_REF: ${{ github.base_ref }}
        PATHS: ${{ inputs.paths }}
        ARGS: ${{ inputs.args }}
        WORKDIR: ${{ inputs.working-directory }}
      run: |
        # The runner adds -e; sember exiting 1 must still reach the annotations.
        set +e -uo pipefail
        if [ -z "$CHANGED" ] && [ -n "$BASE_REF" ]; then
          # Comparing trees needs only the base branch's tip, not history,
          # so a shallow checkout works.
          git fetch --quiet --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || exit 2
          CHANGED="origin/$BASE_REF"
        fi
        cmd=("$RUNNER_TEMP/sember/bin/sember" --check)
        if [ -n "$CHANGED" ] && [ "$CHANGED" != "false" ]; then
          cmd+=(--changed "$CHANGED")
        elif [ -z "$PATHS" ]; then
          PATHS=.
        fi
        read -ra extra <<< "$ARGS"
        read -ra paths <<< "$PATHS"
        log="$RUNNER_TEMP/sember.log"
        "${cmd[@]}" "${extra[@]}" "${paths[@]}" 2> "$log"
        status=$?
        cat "$log" >&2
        # One annotation per file. Annotations take repository-relative
        # paths, and sember prints them relative to the working directory.
        prefix=${WORKDIR%/}/
        [ "$prefix" = "./" ] && prefix=
        files=$(sed -n 's/^would reformat //p' "$log" | while IFS= read -r file; do
          echo "$prefix${file#./}"
        done)
        while IFS= read -r file; do
          [ -n "$file" ] && echo "::error file=$file,title=sember::Not formatted; run sember on this file."
        done <<< "$files"
        { echo "files<<SEMBER_EOF"; echo "$files"; echo "SEMBER_EOF"; } >> "$GITHUB_OUTPUT"
        exit $status
