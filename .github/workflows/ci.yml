name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      # rust-version in Cargo.toml is a promise; check it still builds there.
      - uses: dtolnay/rust-toolchain@1.88
      - name: cargo check (MSRV 1.88)
        run: cargo +1.88 check --all-targets --locked

      # sember's own docs follow the style it enforces.
      - name: sember --check
        run: cargo run --quiet --locked -- --check README.md

  # Runs the GitHub Action in this repository against sember's own docs, and
  # checks that it fails on a file that isn't formatted.
  action:
    name: action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check sember's docs
        uses: ./

      - name: Add an unformatted file
        run: printf 'One sentence. Another\nsentence.\n' > unformatted.md

      - name: Check the unformatted file
        id: unformatted
        continue-on-error: true
        uses: ./
        with:
          changed: "false"
          paths: unformatted.md

      - name: Expect that check to fail
        if: steps.unformatted.outcome != 'failure'
        run: |
          echo "::error::the action passed an unformatted file"
          exit 1
