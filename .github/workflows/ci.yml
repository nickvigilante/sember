name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      # rust-version in Cargo.toml is a promise; check it still builds there.
      - uses: dtolnay/rust-toolchain@1.88
      - name: cargo check (MSRV 1.88)
        run: cargo +1.88 check --all-targets --locked

      # sember's own docs follow the style it enforces.
      - name: sember --check
        run: cargo run --quiet --locked -- --check README.md
